<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Live dubbing run</title></head>
<body>
<!-- Real Chrome, real DubEngine, real VieNeu provider, real background.js (in live-server.js) and the
     real local VieNeu server, on a scripted viewer: seek forward, seek back, pause and resume, 2x, an
     ad that takes over the player's clock. Serve with live-server.js, then runLive() and poll H.done /
     summary(). The clock is a silent <audio>: Chrome pauses a muted <video> in a hidden pane. -->
<button id="go" onclick="runLive()">run</button>
<pre id="out"></pre>
<script>
  window.ready = (async () => {
    for (const f of ["cst-cache.js", "vi-segmenter.js", "cost-policy.js", "dub-planner.js", "dub-prosody.js", "dub-speech.js", "dub-audio.js", "dub-engine.js"]) {
      // ?engine=smooth/old-dub-engine.js runs an older engine (copy it into the git-ignored smooth/)
      const alt = f === "dub-engine.js" && new URLSearchParams(location.search).get("engine");
      await new Promise((res, rej) => { const s = document.createElement("script"); s.src = `${alt ? alt : "../../" + f}?t=${Date.now()}`; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    }
  })();
</script>
<script>
  window.H = { done: false, events: [], samples: 0, overlap: 0, voiceWhilePaused: 0, voiceInAd: 0, seeks: [] };
  // wall seconds -> action. The ad takes the clock to its own timeline and gives it back after.
  const SCRIPT = [
    [22, "seek", 150], [44, "seek", 30], [62, "pause"], [70, "play"], [82, "rate", 2], [100, "rate", 1],
    [104, "ad", 12], [128, "seek", 260], [150, "end"]
  ];
  // ?script=stress: what a restless viewer does. Rapid seeks, a seek while paused, rate changes in
  // the middle of a line, a rewind inside the line being read, a pause during an ad.
  const STRESS = [
    [10, "seek", 40], [11, "seek", 90], [11.8, "seek", 200], [13, "seek", 60], [20, "pause"], [22, "seek", 120],
    [26, "play"], [32, "rate", 0.5], [40, "rate", 1.75], [48, "rate", 1], [52, "back", 2], [58, "back", 1],
    [66, "ad", 10, "pause"], [84, "seek", 300], [86, "rate", 1.25], [100, "end"]
  ];
  // ?script=burst: the rapid seeks, then one more a few seconds later (the stress run's slow recovery)
  const BURST = [[8, "seek", 40], [9, "seek", 90], [9.8, "seek", 200], [11, "seek", 60], [20, "seek", 300], [32, "end"]];
  // ?script=viewer2: a pre-roll ad, pausing in the middle of a line, fast pause/play toggles, a rewind
  // and a rate change while paused, a seek into the middle of a long line, a seek right after an ad
  const VIEWER2 = [
    [0.2, "ad", 6], [14, "pausemid"], [17, "play"], [24, "pause"], [24.4, "play"], [24.8, "pause"], [25.2, "play"],
    [32, "pause"], [33, "back", 3], [34, "rate", 1.5], [36, "play"], [44, "rate", 1], [46, "seek", 63],
    [60, "ad", 8], [68.5, "seek", 200], [85, "end"]
  ];
  const SCRIPTS = { stress: STRESS, burst: BURST, viewer2: VIEWER2 };
  function silentWav(sec, sr = 8000) {
    const n = sec * sr, b = new ArrayBuffer(44 + n * 2), d = new DataView(b);
    const w = (o, s) => [...s].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); d.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); d.setUint32(16, 16, true);
    d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, sr, true); d.setUint32(28, sr * 2, true);
    d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  }
  const send = async msg => (await fetch("/msg", { method: "POST", body: JSON.stringify(msg) })).json();
  window.runLive = async (script = SCRIPTS[new URLSearchParams(location.search).get("script")] || SCRIPT) => {
    if (H.started) return "already running";
    H.started = true;
    await window.ready;
    const E = window.CST_DUB_ENGINE;
    const groups = await (await fetch("/groups.json")).json();
    const clock = new Audio(); clock.volume = 0.01; window.CLOCK = clock;
    clock.src = silentWav(Math.ceil(groups[groups.length - 1].end) + 30);
    await new Promise(r => clock.addEventListener("loadedmetadata", r, { once: true }));
    const prov = E.createVieneuProvider({ sendMessage: send }, { localVoice: "Mỹ Duyên" });
    const voices = [];
    let ad = false;
    const eng = new E.DubEngine({
      video: clock, getGroups: () => groups, providers: { primary: prov },
      now: () => performance.now(), setInterval: (f, ms) => setInterval(f, ms), setTimeout: (f, ms) => setTimeout(f, ms), clearInterval: id => clearInterval(id),
      createObjectURL: b => URL.createObjectURL(new Blob([b], { type: "audio/wav" })), revokeObjectURL: u => URL.revokeObjectURL(u),
      createAudio: url => { const a = new Audio(url); a.preload = "auto"; voices.push(a); return a; },
      adShowing: () => ad, log: (...a) => H.events.push(["log", ...a.map(String)])
    }, { duck: 1, volume: 1 });
    H.engine = eng;
    // ?trace=1: every request sent and every take received, with the clock
    if (new URLSearchParams(location.search).get("trace")) {
      const send0 = eng.renderBatch.bind(eng), add0 = eng.addRendered.bind(eng);
      eng.renderBatch = b => { note("send", b.map(p => p.id).join(","), "jobs", [...eng.jobs.values()].map(j => j.planIds + (j.orphan ? "o" : "")).join(";")); return send0(b); };
      eng.addRendered = (p, ...a) => { note("recv", p.id); return add0(p, ...a); };
    }
    const t0 = performance.now();
    const wall = () => (performance.now() - t0) / 1000;
    const note = (...a) => H.events.push([+wall().toFixed(2), +clock.currentTime.toFixed(2), ...a]);
    // when the script paused the clock (its "pause" event comes a task later, so a sample taken in
    // between saw a voice the engine had not been told to stop yet)
    let pausedAt = 0;
    // what the viewer would hear, every 50 ms
    setInterval(() => {
      if (H.done) return;
      const on = voices.filter(a => !a.paused && !a.ended && a.currentTime > 0).length;
      H.samples++;
      if (on > 1) H.overlap++;
      // counted once the pause is 100 ms old: before that the engine may not have had the event yet
      if (on && clock.paused && performance.now() - pausedAt > 100) {
        H.voiceWhilePaused++;
        const a = voices.find(x => !x.paused && !x.ended && x.currentTime > 0);
        (H.pausedVoice = H.pausedVoice || []).push([+wall().toFixed(2), +clock.currentTime.toFixed(2), Math.round(performance.now() - pausedAt),
          voices.indexOf(a), +a.currentTime.toFixed(2), eng.speech && eng.speech.id, a.src === (eng.speech && eng.rendered.get(eng.speech.id) || {}).url]);
      }
      if (on && ad) H.voiceInAd++;
    }, 50);
    let seen = 0;
    setInterval(() => {
      const st = eng.stats.started;
      while (seen < st.length) {
        const x = st[seen++];
        for (const s of H.seeks) if (s.recovered == null) s.recovered = +(wall() - (s.playAt || s.wall)).toFixed(2);
        note("start", x.id, +(x.t - x.due).toFixed(2), "from", eng.speech && eng.speech.id === x.id ? +eng.speech.offset.toFixed(2) : null);
      }
    }, 25);
    eng.start();
    await new Promise(r => setTimeout(r, 1500));
    await clock.play();
    note("play");
    for (const [at, what, v, extra] of script) {
      await new Promise(r => setTimeout(r, Math.max(0, at * 1000 - (performance.now() - t0))));
      if (what === "seek") { clock.currentTime = v; H.seeks.push({ wall: wall(), to: v, paused: clock.paused }); note("seek", v); }
      if (what === "back") { const to = Math.max(0, clock.currentTime - v); clock.currentTime = to; H.seeks.push({ wall: wall(), to, paused: clock.paused }); note("back", v); }
      if (what === "pause") { clock.pause(); pausedAt = performance.now(); note("pause"); }
      if (what === "pausemid") {                        // pause once a voice has played 1 s into its line
        const t1 = performance.now();
        while (!(eng.speech && voices.some(a => !a.paused && a.currentTime > 1)) && performance.now() - t1 < 8000) await new Promise(r => setTimeout(r, 20));
        const a = voices.find(x => !x.paused);
        clock.pause(); pausedAt = performance.now(); note("pause mid", eng.speech && eng.speech.id, a ? +a.currentTime.toFixed(2) : null);
        H.midPause = { id: eng.speech && eng.speech.id, pos: a ? a.currentTime : null, el: a };
      }
      if (what === "play") { await clock.play(); note("play");
        if (H.midPause && !H.midPause.checked) {        // where the voice goes on after the mid-line pause
          H.midPause.checked = true;
          await new Promise(r => setTimeout(r, 400));
          const a = voices.find(x => !x.paused);
          H.midPause.after = { id: eng.speech && eng.speech.id, same: a === H.midPause.el, pos: a ? +a.currentTime.toFixed(2) : null };
          note("after mid pause", JSON.stringify(H.midPause.after));
        } for (const s of H.seeks) if (s.paused && s.recovered == null) s.playAt = wall(); }
      if (what === "rate") { clock.playbackRate = v; note("rate", v); }
      if (what === "ad") {
        const back = clock.currentTime, pauseIn = extra === "pause";
        ad = true; clock.currentTime = 0; note("ad on");
        if (pauseIn) {                                   // the viewer pauses the ad for 3 s
          await new Promise(r => setTimeout(r, v * 400)); clock.pause(); pausedAt = performance.now(); note("ad paused");
          await new Promise(r => setTimeout(r, 3000)); await clock.play(); note("ad resumed");
          await new Promise(r => setTimeout(r, v * 600 - 3000));
        } else await new Promise(r => setTimeout(r, v * 1000));
        clock.currentTime = back; ad = false; note("ad off", back);
        H.seeks.push({ wall: wall(), to: back, ad: true });
      }
      if (what === "end") break;
    }
    clock.pause(); eng.stop(); H.done = true;
    H.server = await (await fetch("/seen.json")).json();
    document.getElementById("out").textContent = JSON.stringify(summary(), null, 1);
    return "done";
  };
  window.summary = () => {
    const eng = H.engine, st = eng ? eng.stats : { started: [] };
    // the engine's own lag: a line entered mid-way after a seek starts at its place, it is not late
    const lags = st.started.map(x => x.lag);
    return {
      done: H.done, clock: window.CLOCK ? +window.CLOCK.currentTime.toFixed(1) : null,
      spoken: st.started.length, lateStarts: lags.filter(l => l > 0.5).length, lagMax: lags.length ? +Math.max(...lags).toFixed(2) : null,
      dropped: st.dropped, errors: st.errors, errorTypes: st.errorTypes || null, ads: st.ads || 0, adResumed: st.adResumed || 0,
      overlapSamples: H.overlap, voiceWhilePaused: H.voiceWhilePaused, voiceInAd: H.voiceInAd, samples: H.samples,
      seeks: H.seeks, rtf: eng && eng.renderRtf != null ? +eng.renderRtf.toFixed(2) : null,
      fittedOver: eng && eng.fittedOver != null ? +eng.fittedOver.toFixed(2) : null,
      server: H.server || null
    };
  };
</script>
</body></html>
