name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer commit supersedes the checks for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The extension has no dependencies and no build step: the suite is fully offline.
      - name: Run tests with coverage
        shell: bash
        run: npm run coverage 2>&1 | tee "$RUNNER_TEMP/test-coverage.log"
      # Informational: line/branch coverage per file in the job summary, never a gate.
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/test-coverage.log" ]; then
            sed -n '/start of coverage/,/end of coverage/p' "$RUNNER_TEMP/test-coverage.log" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Warning only, never a gate: feature PRs leave the version to the release step (docs/changes/README.md).
  version-guard:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warn if the PR changes the version
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- manifest.json package.json build-info.js version-history.js)
          if [ -n "$files" ]; then
            echo "::warning title=Version files changed::Feature PRs should not bump the version or edit version-history.js. Add docs/changes/<slug>.md instead (see docs/changes/README.md). Changed: $(echo $files | tr '\n' ' ')"
          fi

  # Friends on Windows run the same suite; macOS-only cases skip themselves (docs/WINDOWS.md).
  npm-test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
