name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The extension has no dependencies and no build step: the suite is fully offline.
      - run: npm test
