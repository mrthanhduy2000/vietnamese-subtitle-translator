name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The extension has no dependencies and no build step: the suite is fully offline.
      - run: npm test
      # Informational: line/branch coverage per file in the job summary, never a gate.
      - name: Coverage summary
        if: always()
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run coverage 2>&1 | sed -n '/start of coverage/,/end of coverage/p' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
